services:
  postgres:
    image: postgres:16-alpine
    container_name: code-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codereview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Database/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codereview"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: code-review-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: code-review-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      APP_ENV: docker-local
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: codereview
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      MONGO_URI: mongodb://mongodb:27017/code_review_logs
      JWT_SECRET: b282db152b22f235594d6ba42d0b32b885f5850df26d7331410c483f7894fa20172db272fcf91c79234d0c61bb7da3d5cea3e57ac41c9c420736a3fafa485033
      ADMIN_API_KEY: admin-fault-injection-secret-key
      FAULT_INJECTION_ENABLED: "true"
      AWS_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: 
      AWS_SECRET_ACCESS_KEY: 
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: code-review-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
